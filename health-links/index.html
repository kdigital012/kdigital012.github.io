<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover natural wellness products. Daily tips for better sleep, weight loss, mental clarity, and overall health.">
    <title>The USA Lifestyle - Health & Wellness</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px; /* मोबाइल के लिए एकदम सही साइज */
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-top: 10px;
            border: 3px solid #4CAF50;
            object-fit: cover;
            background-color: #fff; /* लोगो के बैकग्राउंड के लिए */
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 5px;
            text-transform: uppercase; /* नाम को कैपिटल लेटर्स में दिखाने के लिए */
            letter-spacing: 1px;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        /* ग्रिड डिज़ाइन (2 स्क्वायर बटन अगल-बगल) */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }
        .link-btn {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 12px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border-color: #4CAF50;
        }
        /* फोटो बड़ी और चौकोर (Square) */
        .product-img {
            width: 100%;
            aspect-ratio: 1 / 1; 
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .product-text {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.3;
        }
        .sub-text {
            font-size: 11px;
            color: #777;
            font-weight: normal;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profile Section -->
        <!-- आपका नया लोगो यहाँ ऐड कर दिया गया है -->
        <img src="health-links/IMG_20261024_095725.jpg" alt="The USA Lifestyle" class="profile-pic">
        <h1>The USA Lifestyle</h1>
        <p>🌿 Daily tips for better sleep, mental clarity & overall wellness!</p>

        <!-- Links Section -->
        <div class="links-grid">
            
            <!-- Product 1: YU SLEEP -->
            <a href="YAHAN_YU_SLEEP_KA_LINK_DALEIN" class="link-btn">
                <img src="yu-sleep-img.jpg" alt="YU SLEEP" class="product-img">
                <div class="product-text">
                    🌿 Deep Sleep
                    <div class="sub-text">Wake up refreshed naturally</div>
                </div>
            </a>

            <!-- Product 2: ProDentim -->
            <a href="YAHAN_PRODENTIM_KA_LINK_DALEIN" class="link-btn">
                <img src="prodentim-img.jpg" alt="ProDentim" class="product-img">
                <div class="product-text">
                    🦷 Healthy Smile
                    <div class="sub-text">Advanced oral probiotics</div>
                </div>
            </a>

            <!-- Product 3: Brain Song -->
            <a href="YAHAN_BRAIN_SONG_KA_LINK_DALEIN" class="link-btn">
                <img src="brain-song-img.jpg" alt="Brain Song" class="product-img">
                <div class="product-text">
                    🧠 Mental Focus
                    <div class="sub-text">Unlock brain's potential</div>
                </div>
            </a>

        </div> 
    </div> 
</body>
</html>
